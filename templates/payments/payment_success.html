{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful - Taxare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9f7ef;
        }

        .success-box {
            max-width: 600px;
            margin: 100px auto;
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .success-box h2 {
            font-size: 28px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .success-box p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .btn-dashboard {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
        }

        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="success-box">
        <div class="success-icon">🎉</div>
        <h2>Payment Successful!</h2>
        <p><strong>Amount Paid:</strong> ₹{{ payment.amount }}</p>
        <p><strong>Payment ID:</strong> {{ payment.razorpay_payment_id }}</p>
        <a href="{% url 'customer_profile' %}" class="btn btn-success btn-dashboard">Go to Dashboard</a>
    </div>
</div>

</body>
</html>
