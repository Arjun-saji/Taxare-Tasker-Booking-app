{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Checkout - Taxare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .payment-box {
            max-width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .payment-box h3 {
            margin-bottom: 25px;
            text-align: center;
            color: #0d6efd;
        }

        .btn-pay {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="payment-box">
        <h3>Complete Your Payment</h3>
        <p class="text-center text-muted">Booking Amount: ₹{{ payment.amount }}</p>

        <!-- Razorpay Payment Form -->
        <form method="POST">
            {% csrf_token %}
            <script
                src="https://checkout.razorpay.com/v1/checkout.js"
                data-key="{{ razorpay_key }}"
                data-amount="{{ amount }}"
                data-currency="INR"
                data-order_id="{{ order_id }}"
                data-buttontext="Pay Now"
                data-name="Taxare"
                data-description="Payment for Booking ID #{{ payment.booking.id }}"
                data-image="{% static 'images/logo.png' %}"
                data-prefill.name="{{ request.user.username }}"
                data-prefill.email="{{ request.user.email }}"
                data-theme.color="#0d6efd">
            </script>
            <input type="hidden" custom="Hidden Element" name="hidden">
        </form>

        <div class="text-center text-muted mt-3">
            <small>Secure Payment Gateway powered by Razorpay</small>
        </div>
    </div>
</div>

</body>
</html>
