<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taxare Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .chat-button-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #128c7e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #075e54;
        }
    </style>
</head>
<body>

    <div class="chat-button-container">
        <a href="{% url 'start_chat' tasker.username %}" class="btn btn-primary">Chat with {{ tasker.username }}</a>
    </div>

</body>
</html>
