<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Tasker</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> <!-- Link your stylesheet here -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f2f6f7;
            margin: 0;
            padding: 0;
        }

        .booking-container {
            max-width: 1100px;
            margin: 50px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .info-section {
            flex: 1;
            min-width: 280px;
            padding: 20px;
            margin-top: 90px;
        }

        .info-section h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0a2540;
        }

        .info-section p {
            margin-bottom: 20px;
            color: #4a5568;
        }

        .info-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            color: #2d3748;
        }

        .info-item i {
            margin-right: 10px;
            color: #3182ce;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }

        form {
            background: #f8fafa;
            border-radius: 12px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3748;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        button {
            background-color: #2563eb;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1e40af;
        }

        @media (max-width: 768px) {
            .booking-container {
                flex-direction: column;
            }

            .info-section, .form-section {
                padding: 10px;
            }
        }
    </style>




</head>

<div class="booking-container">
    <div class="info-section">
        <p style="text-transform: uppercase; font-size: 12px; color: #94a3b8;">We're here to help you</p>
        <h2>Book Your <br>Service Tasker</h2>
        <p>Need help with a task? Book a reliable tasker tailored to your needs. Fill the form and let’s get started!</p>

        <div class="info-item">
            <i>📧</i>
            <span>support@taxare.com</span>
        </div>
        <div class="info-item">
            <i>📞</i>
            <span>+91 98765 43210</span>
        </div>
    </div>

    <div class="form-section">
        <form method="POST" action="{% url 'book_service' tasker.id service.id %}">
            <!-- <h1>Book {{ tasker.user.username }} for {{ service.name }}</h1> -->

            
            {% csrf_token %}
            <!-- Date -->
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date_booking" required>
            </div>

            <!-- Start Time -->
            <div class="form-group">
                <label for="start_time">Start Time</label>
                <input type="time" id="start_time" name="start_time" required>
            </div>

            <!-- End Time -->
            <div class="form-group">
                <label for="end_time">End Time</label>
                <input type="time" id="end_time" name="end_time" required>
            </div>

            <!-- Price Suggestion -->
            <div class="form-group">
                <label for="tasker_price_suggestion">Tasker Price Suggestion (Optional)</label>
                <input type="number" step="0.01" id="tasker_price_suggestion" name="tasker_price_suggestion" placeholder="e.g. 200.00">
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message to Tasker (Optional)</label>
                <textarea id="message" name="message" rows="4" placeholder="Add any special instructions or details..."></textarea>
            </div>

            <button type="submit">Book Now</button>
        </form>
    </div>
</div>



</html>
